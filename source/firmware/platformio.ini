[platformio]
default_envs = s3_locked, s3_virtual_demo
core_dir = .tools/pio
build_dir = .pio/build

[env]
platform = platformio/espressif32@8.0.0
platform_packages =
  platformio/framework-arduinoespressif32@4.30312.261024
  platformio/framework-arduinoespressif32-esp32s3-libs@3.3.12
  platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
  platformio/tool-esptool@2.50400.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:tools/capture_metadata.py
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DROAST_REFERENCE_N16R8=1
  -DROAST_WIFI_ENABLE=1
monitor_speed = 115200

[env:s3_locked]
build_flags = ${env.build_flags} -DROAST_VIRTUAL_DEMO=0

[env:s3_virtual_demo]
build_flags = ${env.build_flags} -DROAST_VIRTUAL_DEMO=1

; Compile-check default provisioning with RGB disabled. Not a release image.
[env:s3_network_compilecheck]
build_flags = ${env.build_flags} -DROAST_VIRTUAL_DEMO=1 -DROAST_RGB_ENABLE=0
