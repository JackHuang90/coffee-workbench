name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Package frontend
        run: |
          mkdir -p ../release
          cd dist
          zip -r ../../release/coffee-workbench-web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-release
          path: release/coffee-workbench-web.zip
          if-no-files-found: error
          retention-days: 14
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the GitHub Pages base path
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        # Keep the root-path Release ZIP unchanged; Pages needs its own asset prefix.
        run: npm run build -- --base="${PAGES_BASE_PATH}/" --outDir .sites-runtime/pages-dist
      - name: Upload GitHub Pages assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/.sites-runtime/pages-dist

  pages:
    name: Deploy frontend to GitHub Pages
    needs: frontend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
      # Preserve newer pending deployments even if an older build finishes later.
      queue: max
    steps:
      - name: Skip outdated commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # An older build finishing late must not roll the site back.
        run: |
          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deployment because main has a newer commit."
          fi
      - name: Deploy GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  firmware:
    name: Firmware tests and reference images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source/firmware
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install frontend dependencies for firmware export integration tests
        working-directory: source
        run: npm ci
      - name: Run native C++, setup page, and Python tests
        run: python tools/test_native.py
      - name: Cache pinned PlatformIO packages
        uses: actions/cache@v6
        with:
          path: |
            source/firmware/.tools/pio/platforms
            source/firmware/.tools/pio/packages
            source/firmware/.tools/pio/.cache
          key: ${{ runner.os }}-${{ runner.arch }}-pio-6.2.0-${{ hashFiles('source/firmware/platformio.ini') }}
      - name: Install PlatformIO in the release tool environment
        run: |
          python -m venv .tools/venv
          .tools/venv/bin/python -m pip install platformio==6.2.0
      - name: Clean-build and validate all three firmware environments
        run: .tools/venv/bin/python tools/build_release.py
      - name: Verify firmware checksums
        working-directory: source/firmware/artifacts
        run: sha256sum -c SHA256SUMS
      - name: Package firmware binaries and SHA256 only
        run: |
          mkdir -p ../../release
          package_dir="$(mktemp -d)"
          for environment in s3_locked s3_virtual_demo; do
            mkdir -p "$package_dir/$environment"
            for image in bootloader.bin partitions.bin boot_app0.bin application.bin reference-merged.bin; do
              cp "artifacts/$environment/$image" "$package_dir/$environment/$image"
            done
          done
          cd "$package_dir"
          sha256sum s3_locked/*.bin s3_virtual_demo/*.bin > SHA256SUMS
          sha256sum -c SHA256SUMS
          zip -r "$GITHUB_WORKSPACE/release/coffee-workbench-firmware.zip" s3_locked s3_virtual_demo SHA256SUMS
      - name: Preserve build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-failure-logs
          path: source/firmware/artifacts/**/*.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-release
          path: release/coffee-workbench-firmware.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish automatic prerelease
    needs: [frontend, firmware]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Generate package checksums and release notes
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLASH_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/source/firmware/docs/build-and-flash.md
        run: |
          cd release
          sha256sum coffee-workbench-web.zip coffee-workbench-firmware.zip > SHA256SUMS
          {
            printf '自动构建 #%s\n\n' "$RUN_NUMBER"
            printf '源码提交：`%s`\n\n' "$COMMIT_SHA"
            printf '构建记录：%s\n\n' "$RUN_URL"
            printf '刷机说明：%s\n\n' "$FLASH_DOCS_URL"
            printf '%s\n' \
              '- coffee-workbench-web.zip：前端静态文件，请通过 HTTP/HTTPS 服务访问。' \
              '- coffee-workbench-firmware.zip：仅含 s3_locked 与 s3_virtual_demo 的 .bin 镜像和 SHA256SUMS。' \
              '- SHA256SUMS：以上两个下载包的 SHA256 校验和。' \
              '' \
              '固件为未完成实机验证的参考构建，物理加热和风机输出禁用。刷机前阅读上方对应源码版本的刷机说明；application.bin 写入 0x10000，不能写到地址 0。reference-merged.bin 从 0x0 写入，可能覆盖已保存的配置。'
          } > ../release-notes.md
      - name: Create or update this build's release
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="build-${RUN_NUMBER}-${COMMIT_SHA:0:7}"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A rerun replaces assets only on its own immutable commit tag.
            gh release upload "$tag" release/*.zip release/SHA256SUMS --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" release/*.zip release/SHA256SUMS \
              --target "$COMMIT_SHA" \
              --title "自动构建 #${RUN_NUMBER} (${COMMIT_SHA:0:7})" \
              --notes-file release-notes.md \
              --prerelease --latest=false
          fi
